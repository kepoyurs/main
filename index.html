<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Performance Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Client Performance Dashboard</h1>
            <p class="subtitle">Upload and showcase your performance metrics</p>
        </header>

        <div class="controls">
            <button id="addScreenshotBtn" class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Add Screenshot
            </button>
            <div class="filter-group">
                <label for="categoryFilter">Filter:</label>
                <select id="categoryFilter" class="select">
                    <option value="all">All Categories</option>
                    <option value="social-media">Social Media</option>
                    <option value="website">Website Analytics</option>
                    <option value="seo">SEO Performance</option>
                </select>
            </div>
            <button id="clearAllBtn" class="btn btn-secondary">Clear All</button>
        </div>

        <div id="uploadModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Upload Screenshot</h2>

                <div id="dropZone" class="drop-zone">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    <p>Drag & drop your screenshot or PDF here</p>
                    <p class="or">or</p>
                    <button type="button" class="btn btn-outline" onclick="document.getElementById('fileInput').click()">
                        Browse Files
                    </button>
                    <input type="file" id="fileInput" accept="image/*,application/pdf" style="display: none;">
                </div>

                <div id="uploadForm" class="upload-form" style="display: none;">
                    <div class="preview-container" id="previewContainer">
                        <img id="imagePreview" src="" alt="Preview" style="display: none;">
                        <canvas id="pdfPreview" style="display: none; max-width: 100%;"></canvas>
                    </div>

                    <div class="form-group">
                        <label for="screenshotCategory">Category *</label>
                        <select id="screenshotCategory" class="select" required>
                            <option value="">Select a category</option>
                            <option value="social-media">Social Media</option>
                            <option value="website">Website Analytics</option>
                            <option value="seo">SEO Performance</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="screenshotTitle">Title</label>
                        <input type="text" id="screenshotTitle" class="input" placeholder="e.g., Instagram Engagement - November 2024">
                    </div>

                    <div class="form-group">
                        <label for="screenshotDescription">Description</label>
                        <textarea id="screenshotDescription" class="textarea" rows="3" placeholder="Add notes or context for this screenshot..."></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="cancelUpload" class="btn btn-secondary">Cancel</button>
                        <button type="button" id="saveScreenshot" class="btn btn-primary">Save Screenshot</button>
                    </div>
                </div>
            </div>
        </div>

        <main id="dashboardContent">
            <div id="emptyState" class="empty-state">
                <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <h2>No screenshots yet</h2>
                <p>Upload your first performance screenshot to get started</p>
                <button class="btn btn-primary" onclick="document.getElementById('addScreenshotBtn').click()">
                    Add Your First Screenshot
                </button>
            </div>

            <div id="screenshotsGrid" class="screenshots-grid"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
